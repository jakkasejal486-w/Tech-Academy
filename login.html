   <!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Tech Learning Academy</title>

<style>

*{
box-sizing:border-box;
}

body{
background-color:black;
color:white;
margin:0;
padding:90px 30px 30px;
}


/* ================= NAVBAR ================= */

nav{
position:fixed;
top:0;
left:0;
right:0;
width:100%;
height:70px;
background-color:#1e3a5f;
padding:10px 20px;
display:flex;
align-items:center;
gap:10px;
z-index:1000;
}

nav a{
color:#40E0D0;
text-decoration:none;
font-size:15px;
font-weight:bold;
white-space:nowrap;
}

nav a:hover{
color:white;
}

nav p{
color:white;
font-size:20px;
margin:0;
padding:0;
white-space:nowrap;
}


/* ================= DASHBOARD ================= */

.student-dashboard{
margin-left:auto;
position:relative;
flex-shrink:0;
}

.student-logo{
width:55px;
height:55px;
border-radius:50%;
border:3px solid #40E0D0;
background-color:#1e3a5f;
color:white;
font-size:27px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
padding:0;
transition:0.2s;
}

.student-logo:hover{
background-color:#40E0D0;
color:#1e3a5f;
}

.student-menu{
display:none;
position:absolute;
top:65px;
right:0;
width:200px;
background-color:#1e3a5f;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.5);
z-index:2000;
}

.student-menu.show{
display:flex;
flex-direction:column;
}

.student-menu a{
color:#40E0D0;
text-decoration:none;
padding:15px 18px;
font-size:16px;
font-weight:bold;
border-bottom:1px solid rgba(64,224,208,0.2);
white-space:nowrap;
}

.student-menu a:hover{
background-color:#40E0D0;
color:#1e3a5f;
}


/* ================= LOGIN FORM ================= */

form{
width:600px;
max-width:95%;

margin:50px auto 0;

padding:35px 45px;

border:2px solid #40E0D0;
border-radius:15px;

background-color:#080808;

box-shadow:0 0 20px rgba(64,224,208,0.25);
}

.required{
color:#40E0D0;
font-size:14px;
margin-bottom:20px;
}

.section-title{
color:#40E0D0;
font-size:22px;

border-bottom:1px solid #40E0D0;

padding-bottom:8px;

margin-top:20px;
margin-bottom:25px;
}

.form-row{
display:flex;
align-items:center;
margin-bottom:20px;
}

label{
color:#40E0D0;
width:230px;
font-size:18px;
}

input[type="email"],
input[type="password"]{

width:300px;
height:40px;

padding:8px 12px;

font-size:16px;

border:1px solid #40E0D0;
border-radius:6px;

background-color:#111;
color:white;

outline:none;
}

input[type="email"]:focus,
input[type="password"]:focus{

border:2px solid #40E0D0;

box-shadow:0 0 8px rgba(64,224,208,0.4);
}


/* ================= BUTTONS ================= */

.login,
.register,
.getotp,
.otp{

font-size:17px;
font-weight:bold;

border-radius:7px;

cursor:pointer;

padding:10px 25px;
}


/* LOGIN */

.login{

display:block;

margin:25px auto;

background-color:#40E0D0;
color:black;

border:2px solid #40E0D0;
}

.login:hover{

background-color:black;
color:#40E0D0;
}


/* OTP */

.getotp{

display:block;

margin:25px auto;

background-color:#40E0D0;
color:black;

border:2px solid #40E0D0;
}

.getotp:hover{

background-color:black;
color:#40E0D0;
}


/* VERIFY */

.otp{

display:block;

margin:25px auto;

background-color:#40E0D0;
color:black;

border:2px solid #40E0D0;
}

.otp:hover{

background-color:black;
color:#40E0D0;
}


/* REGISTER */

.register{

display:block;

margin:20px auto;

background-color:black;
color:#40E0D0;

border:2px solid #40E0D0;
}

.register:hover{

background-color:#40E0D0;
color:black;
}


/* TEXT */

.account-text{

color:#40E0D0;

text-align:center;

font-size:18px;

font-weight:bold;
}

.register-text{

color:#40E0D0;

text-align:center;

font-size:20px;

font-weight:bold;
}


/* ================= MOBILE ================= */

@media(max-width:700px){

body{

padding:90px 15px 15px;
}

form{

padding:25px 20px;

margin-top:40px;
}

.form-row{

flex-direction:column;

align-items:flex-start;
}

label{

width:auto;

margin-bottom:8px;
}

input[type="email"],
input[type="password"]{

width:100%;
}

}

</style>

</head>


<body>

<button
class="student-logo"
type="button"
onclick="toggleStudentMenu()"
title="Student Dashboard">

🎓

</button>


<div
class="student-menu"
id="studentMenu">
 
<a href="student-dashboard.php">
🏠 Dashboard</a>

</div>

</nav>


<!-- ================= LOGIN FORM ================= -->

<form action="login.php" method="POST">


<p class="required">
Fields marked with * are required.
</p>


<div class="section-title">
Login
</div>


<!-- EMAIL -->

<div class="form-row">

<label for="mail">
1) Email *
</label>

<input
type="email"
id="mail"
name="email"
placeholder="Enter your email"
required>

</div>


<!-- PASSWORD -->

<div class="form-row">

<label for="pass">
2) Password *
</label>

<input
type="password"
id="pass"
name="password"
placeholder="Enter your password"
required>

</div>


<!-- LOGIN -->

type="submit"
class="login">

LOGIN

</button>


<p class="account-text">
----------------- Don't have an account? -----------------
</p>


<p class="register-text">
Register here
</p>


<!-- REGISTER -->

<button
type="button"
class="register"
onclick="window.location.href='forms.html'">

REGISTER

</button>


</form>


<script>

function toggleStudentMenu(){

const menu =
document.getElementById("studentMenu");

menu.classList.toggle("show");

}

</script>


</body>
